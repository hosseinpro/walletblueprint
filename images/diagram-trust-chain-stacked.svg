  <line class="dgm-line" x1="170" y1="70" x2="170" y2="100"/>

  <g transform="translate(-81,15)">
    <path class="dgm-box" d="M 218,142 C 204,142 202,124 214,119 C 210,104 226,94 238,101 C 244,88 266,88 272,101 C 288,97 298,112 290,123 C 300,131 294,142 282,142 Z"/>
  </g>
  <text class="dgm-label" x="170" y="134">INTERNET</text>

  <line class="dgm-line" x1="170" y1="157" x2="170" y2="196"/>

  <rect class="dgm-chrome" x="100" y="196" width="140" height="200" rx="18"/>
  <rect class="dgm-chrome" x="112" y="222" width="116" height="140"/>
  <line class="dgm-chrome" x1="158" y1="209" x2="182" y2="209" stroke-linecap="round"/>
  <circle class="dgm-chrome" cx="148" cy="209" r="2"/>
  <circle class="dgm-chrome" cx="170" cy="378" r="11"/>

  <rect class="dgm-box" x="122" y="258" width="96" height="68" rx="2"/>
  <text class="dgm-label sm" x="170" y="280">HARDWARE</text>
  <text class="dgm-label sm" x="170" y="295">WALLET</text>
  <text class="dgm-label sm" x="170" y="310">APP</text>

