  <rect class="dgm-chrome" x="364" y="40" width="126" height="152"/>
  <line class="dgm-chrome" x1="416" y1="27" x2="442" y2="27" stroke-linecap="round"/>
  <circle class="dgm-chrome" cx="405" cy="27" r="2"/>
  <circle class="dgm-chrome" cx="427" cy="208" r="12"/>

