  <line class="dgm-line" x1="154" y1="120" x2="200" y2="120"/>

  <path class="dgm-box" d="M 218,142 C 204,142 202,124 214,119 C 210,104 226,94 238,101 C 244,88 266,88 272,101 C 288,97 298,112 290,123 C 300,131 294,142 282,142 Z"/>
  <text class="dgm-label" x="250" y="126">INTERNET</text>

  <line class="dgm-line" x1="300" y1="120" x2="376" y2="120"/>

