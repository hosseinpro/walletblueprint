<svg xmlns="http://www.w3.org/2000/svg" role="img"
     viewBox="-16 -12 812 324" width="812" height="324">
  <style>
    .dgm-box       { fill: rgba(255,255,255,0.05); stroke: #ffffff; stroke-width: 1.25; }
    .dgm-enclosure { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.45); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .dgm-line      { stroke: #ffffff; stroke-width: 1.25; fill: none; }
    .dgm-chrome    { stroke: rgba(255,255,255,0.45); stroke-width: 1.25; fill: none; }
    .dgm-label {
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; letter-spacing: 0.07em; fill: #ffffff; text-anchor: middle;
    }
    .dgm-label.sm   { font-size: 10.5px; }
    .dgm-label.note { font-size: 10.5px; fill: #bfe0ff; letter-spacing: 0.14em; }
  </style>
  <title id="dgm2-title">Target architecture: the secure element drives the trusted display and trusted button directly, with the companion app connected over NFC, USB or BLE</title>

  <rect class="dgm-chrome" x="4" y="20" width="150" height="260" rx="20"/>
  <rect class="dgm-chrome" x="16" y="48" width="126" height="196"/>
  <line class="dgm-chrome" x1="68" y1="33" x2="94" y2="33" stroke-linecap="round"/>
  <circle class="dgm-chrome" cx="57" cy="33" r="2"/>
  <circle class="dgm-chrome" cx="79" cy="262" r="12"/>

  <rect class="dgm-box" x="28" y="116" width="102" height="68" rx="2"/>
  <text class="dgm-label sm" x="79" y="138">HARDWARE</text>
  <text class="dgm-label sm" x="79" y="153">WALLET</text>
  <text class="dgm-label sm" x="79" y="168">APP</text>

  <line class="dgm-line" x1="130" y1="150" x2="310" y2="150"/>
  <text class="dgm-label note" x="220" y="138">NFC / USB / BLE</text>

  <rect class="dgm-enclosure" x="310" y="56" width="462" height="188" rx="12"/>

  <rect class="dgm-box" x="340" y="122" width="150" height="56" rx="2"/>
  <text class="dgm-label" x="415" y="155">SECURE ELEMENT</text>

  <path class="dgm-line" d="M 490,150 H 540 M 540,106 V 194 M 540,106 H 596 M 540,194 H 596"/>

  <rect class="dgm-box" x="596" y="82" width="156" height="48" rx="2"/>
  <text class="dgm-label" x="674" y="111">TRUSTED DISPLAY</text>

  <rect class="dgm-box" x="596" y="170" width="156" height="48" rx="2"/>
  <text class="dgm-label" x="674" y="199">TRUSTED BUTTON</text>
</svg>
